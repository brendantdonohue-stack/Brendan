name: Check NYC movie watchlist

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      test_email_only:
        description: "Send a test email instead of running the real check (to confirm SMTP works)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required secrets
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          missing=""
          [ -z "$SMTP_HOST" ] && missing="$missing SMTP_HOST"
          [ -z "$SMTP_USER" ] && missing="$missing SMTP_USER"
          [ -z "$SMTP_PASSWORD" ] && missing="$missing SMTP_PASSWORD"
          [ -z "$ALERT_TO" ] && missing="$missing ALERT_TO"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secrets:$missing"
            echo "Add them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "(SMTP_PORT and ALERT_FROM are optional and fall back to defaults, so they're not checked here.)"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Send test email
        if: ${{ inputs.test_email_only }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python -m nyc_movie_alert.cli test-email

      - name: Run watchlist check
        if: ${{ !inputs.test_email_only }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python -m nyc_movie_alert.cli check

      - name: Commit updated state
        run: |
          git config user.name "movie-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Update alert state [skip ci]"
          git push
